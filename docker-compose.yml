services:
  db_dev:
    image: postgres:16
    container_name: temple_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: temple
      POSTGRES_PASSWORD: temple
      POSTGRES_DB: temple_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

  db_test:
    image: postgres:16
    container_name: temple_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: temple
      POSTGRES_PASSWORD: temple
      POSTGRES_DB: temple_test
    ports:
      - "5433:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data

volumes:
  pgdata_dev:
  pgdata_test:
