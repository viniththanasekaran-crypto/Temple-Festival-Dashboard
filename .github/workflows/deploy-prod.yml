name: Deploy — Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "deploy" to confirm production deployment
        required: true

jobs:
  guard:
    name: Confirm deployment
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "Confirmation failed. Type 'deploy' to proceed."
            exit 1
          fi

  deploy-frontend:
    name: Deploy frontend to Vercel (prod)
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4
      # TODO: Configure Vercel secrets for production
      - run: echo "Frontend deploy to Vercel production — configure secrets to enable"

  deploy-backend:
    name: Deploy backend to Fly.io (prod)
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4
      # TODO: Configure Fly.io secrets for production
      - run: echo "Backend deploy to Fly.io production — configure secrets to enable"
