name: CI

on:
  push:
    branches: [dev, uat, staging, production]
  pull_request:
    branches: [dev, uat, staging, production]

jobs:
  backend:
    name: Backend — lint, format, test
    runs-on: ubuntu-latest

    services:
      postgres_test:
        image: postgres:16
        env:
          POSTGRES_USER: temple
          POSTGRES_PASSWORD: temple
          POSTGRES_DB: temple_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend

      - name: Lint
        run: npm run lint
        working-directory: backend

      - name: Format check
        run: npm run format:check
        working-directory: backend

      - name: Run tests
        run: npm test
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://temple:temple@localhost:5433/temple_test
          TEST_DATABASE_URL: postgresql://temple:temple@localhost:5433/temple_test
          JWT_SECRET: ci_test_access_secret
          JWT_REFRESH_SECRET: ci_test_refresh_secret
          JWT_ACCESS_EXPIRY: 15m
          JWT_REFRESH_EXPIRY: 7d
          CORS_ORIGIN: http://localhost:5173

  frontend:
    name: Frontend — lint, format, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Format check
        run: npm run format:check
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
